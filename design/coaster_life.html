    return `<div class="uses"><span class="small muted">${label}</span><div class="chips">${ids.map(x =>
      `<button class="chip" style="--c:${color}" data-act="use-go" data-kind="${kind}" data-id="${esc(x)}">${esc(names[x]?.name || x)}</button>`).join('')}</div></div>`;
  }).join('');
}
function jobCard(j, i) {
  const jobs = byId(D.jobs), lessons = D.tutorial.filter(l => l.job === j.id);
  const after = (j.after || []).filter(a => a !== 'built').map(a => `after ${jobs[a]?.number ? 'Job ' + jobs[a].number : esc(a)}`).join(', ');
  return `<div class="card job ${esc(j.status)}" id="job-${esc(j.id)}">${editBtn('jobs', i)}
    <div class="job-head"><span class="job-n">${j.number ?? (j.status === 'done' ? '✓' : '…')}</span><div><h3>${esc(j.title)}</h3><p class="small">${esc(j.goal)}</p></div></div>
    <div class="job-bar"><button class="status-chip ${esc(j.status)}" data-act="job-status" data-i="${i}" title="Move it on">${esc(STATUS[j.status] || j.status)}</button>
      ${after ? `<span class="small muted">${after}</span>` : ''}<span class="spacer"></span>
      <button class="btn small ghost" data-act="job-up" data-i="${i}" title="Earlier">↑</button><button class="btn small ghost" data-act="job-down" data-i="${i}" title="Later">↓</button></div>
    ${(j.builds || []).length ? `<details class="more"><summary>What it builds (${j.builds.length})</summary><ol class="builds">${j.builds.map(b => `<li>${esc(b)}</li>`).join('')}</ol></details>` : ''}
    ${lessons.length ? `<details class="more"><summary>Tutorial lessons it adds (${lessons.length})</summary><div class="chips">${lessons.map(l =>
      `<button class="chip" style="--c:#7a4fd0" data-act="go" data-tab="tutorial" data-id="lesson-${esc(l.id)}">${esc(l.title)}</button>`).join('')}</div></details>` : ''}
    ${usesChips(j.uses || {})}
    ${j.test ? `<p class="small"><b>Test:</b> ${esc(j.test)}</p>` : ''}
    ${j.doneWhen ? `<p class="small"><b>Done when:</b> ${esc(j.doneWhen)}</p>` : ''}
    ${(j.ask || []).length ? `<p class="ask small"><b>Ask first:</b> ${j.ask.map(esc).join(' ')}</p>` : ''}
  </div>`;
}
function renderPlan() {
  const numbered = D.jobs.filter(j => j.number), count = s => numbered.filter(j => j.status === s).length;
  const parts = new Set(D.buildParts.map(p => p.id));
  const section = (name, text, list) => list.length ? `<section class="section"><div class="section-head"><div><h3>${esc(name)}</h3><p>${esc(text)}</p></div></div>
    <div class="grid" style="--min:400px">${list.map(([j, i]) => jobCard(j, i)).join('')}</div></section>` : '';
  const all = D.jobs.map((j, i) => [j, i]);
  const left = USE_KINDS.map(([kind, list, label, color]) => {
    const used = new Set(D.jobs.flatMap(j => j.uses?.[kind] || []));
    return [kind, D[list].filter(x => x.id && !used.has(x.id)).map(x => x.id), label, color];
  });
  const leftOver = Object.fromEntries(left.map(([kind, ids]) => [kind, ids]));
  const nothingLeft = left.every(([, ids]) => !ids.length);
  return `
  <section class="section"><div class="section-head"><div><h2>Build plan</h2><p>The design, brought into the game one job at a time. Each job is one session, ends with a test, and leaves the game playable. Click a job's status to move it on; ↑ and ↓ change the order within its part.</p></div>
    <div class="spacer"></div>${addBtn('jobs', 'Add a job')}</div>
    <div class="card plan-top"><div class="progress"><i style="width:${numbered.length ? count('done') / numbered.length * 100 : 0}%"></i></div>
      <span><b>${count('done')}</b> of ${numbered.length} jobs done</span><span class="muted small">${count('doing')} doing now · ${count('todo')} to do</span></div></section>
  ${D.buildParts.map(p => section(p.name, p.text, all.filter(([j]) => j.part === p.id))).join('')}
  ${section('Not in a part', 'Jobs whose part is missing (see the checks).', all.filter(([j]) => !parts.has(j.part)))}
  <section class="section" id="unplanned"><div class="section-head"><div><h3>Not in any job yet</h3><p>Parts of the design no job brings into the game. Add them to a job's "uses" to plan them.</p></div></div>
    <div class="card">${nothingLeft ? '<p>✓ Every part of the design is in a job.</p>' : usesChips(leftOver)}</div></section>`;
}

// ---- the tutorial ----
function whenText(w) {
  const [kind, rest = ''] = String(w || '').split(/:(.*)/s), r = rest.trim();
  if (kind === 'start') return 'A new game';
  if (kind === 'after') return `After “${byId(D.tutorial)[r]?.title || r}”`;
  if (kind === 'need below') { const [n, v] = r.split(/\s+/); return `${byId(D.needs)[n]?.name || n} below ${v}`; }
  if (kind === 'first') return `The first time: ${r}`;
  if (kind === 'arrive') return `Arriving at ${placeName(r)}`;
  if (kind === 'time') return `At ${r}`;
  if (kind === 'day') return `On day ${r}`;
  if (kind === 'money above') return `Over GH₵${r}`;
  if (kind === 'money below') return `Under GH₵${r}`;
  return w || 'Any time';
}
function pointText(p) {
  const [kind, rest = ''] = String(p || '').split(/:(.*)/s);
  return kind === 'place' ? `📍 ${placeName(rest)}` : kind === 'ui' ? `👆 the ${rest}` : '';
}
function renderTutorial() {
  const jobs = byId(D.jobs);
  const groups = [['', 'Every start', 'Lessons for any start, as each system comes into the game.'], ...D.story.origins.map(o => [o.id, o.name, o.text])];
  const lesson = ([l, i], k) => `<div class="lesson" id="lesson-${esc(l.id)}">
    <div class="tip"><span class="tip-n">${k + 1}</span><div><b>${esc(l.title)}</b><p>${esc(l.text)}</p></div>${editBtn('tutorial', i)}</div>
    <div class="chips"><span class="chip" style="--c:#2e5aa6" title="When it shows">⏱ ${esc(whenText(l.when))}</span>
      ${l.point ? `<span class="chip" style="--c:#1d6b3a" title="What it points at">${esc(pointText(l.point))}</span>` : ''}
      <span class="chip" style="--c:#b07a08" title="What ticks it off">✓ ${esc(l.doneWhen || 'got it')}</span>
      ${jobs[l.job] ? `<button class="chip" style="--c:#7a4fd0" data-act="go" data-tab="plan" data-id="job-${esc(l.job)}">${esc(jobs[l.job].number ? 'Job ' + jobs[l.job].number : jobs[l.job].title)}</button>` : ''}</div>
  </div>`;
  return `
  <section class="section"><div class="section-head"><div><h2>Tutorial</h2><p>How the game teaches as you play. The first time something matters, a tip card says what to do and an arrow shows the way, and the goals say what to do now. Each lesson comes into the game with its job.</p></div>
    <div class="spacer"></div>${addBtn('tutorial', 'Add a lesson')}</div>
    <div class="card small"><b>How a lesson works.</b> <i>When</i> it shows: a new game, after another lesson, a need getting low, the first time something happens, arriving somewhere, a time or a day, or money going over or under an amount. <i>Points at</i>: a place (the arrow shows the way) or a part of the screen. <i>Done when</i>: what she does to tick it off ("got it" is a button).</div></section>
  ${groups.map(([id, name, text]) => {
    const list = D.tutorial.map((l, i) => [l, i]).filter(([l]) => (l.origin || '') === id);
    return list.length ? `<section class="section"><div class="section-head"><div><h3>${esc(name)}</h3><p>${esc(text || '')}</p></div></div>
      <div class="lessons">${list.map(lesson).join('')}</div></section>` : '';
  }).join('')}`;
}

// ---- changing anything else: one item (or one value) as JSON ----
const at = (path, d = D) => path.split('.').reduce((o, k) => o?.[k], d);
function setAt(path, value, d = D) {
  const keys = path.split('.'), last = keys.pop();
  const parent = keys.reduce((o, k) => (o[k] ??= {}), d);
  parent[last] = value;
}
function blank(v) {
  if (Array.isArray(v)) return v.length && v[0] && typeof v[0] === 'object' ? [blank(v[0])] : v.slice();
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, blank(x)]));
  return typeof v === 'number' ? 0 : typeof v === 'boolean' ? false : '';
}
function editItem(path, i) {
  if (!Array.isArray(at(path))) setAt(path, []);
  const list = at(path), isNew = i === undefined;
  let item = list[i];
  if (isNew) {
    item = list[0] ? blank(list[0]) : { id: '', name: '' };
    if ('id' in item || !list.length) item.id = uniqueId('new', new Set(list.map(x => x.id)));
    if ('name' in item) item.name = 'New';
  }
  modalState = { path, i, isNew };
  modal(`<h3>${isNew ? 'Add' : 'Change'}: ${esc(path)}</h3>
    <p class="small muted">Change the words between the quotes, and keep the commas and brackets. Ids link things together, so if you change one, change the links to it too (the checks will tell you).</p>
    <textarea class="json" id="itemJson" spellcheck="false">${esc(pretty(item))}</textarea>
    <p class="form-error" id="itemError"></p>
    <div class="modal-actions"><button class="btn primary" data-act="item-save">${isNew ? 'Add it' : 'Save'}</button>
      ${isNew ? '' : '<button class="btn" data-act="item-dup">Make a copy</button><button class="btn danger" data-act="item-del">Delete</button>'}
      <button class="btn" data-act="modal-close">Cancel</button></div>`);
}
function readItem() {
  try {
    const v = JSON.parse($('#itemJson').value);
    if (modalState.value) {
      if (Array.isArray(v) !== Array.isArray(at(modalState.path)) || typeof v !== 'object' || v === null) throw new Error('Keep it the same shape: a [ … ] list or a { … } block, as it was.');
    } else if (!v || typeof v !== 'object' || Array.isArray(v)) throw new Error('It should be one { … } block.');
    return v;
  } catch (e) {
    $('#itemError').textContent = e.message;
    return null;
  }
}
function saveItem(copy) {
  const v = readItem();
  if (!v) return;
  const { path, i, isNew } = modalState;
  if (modalState.value) { closeModal(); return change(d => setAt(path, v, d)); }
  const list = at(path), hasIds = 'id' in v || list.some(x => x && 'id' in x);
  if (copy) v.id = uniqueId(`${v.id || 'copy'}_copy`, new Set(list.map(x => x.id)));
  if (hasIds && !v.id) return void ($('#itemError').textContent = 'It needs an "id".');
  if (hasIds && list.some((x, j) => x.id === v.id && (isNew || copy || j !== i))) return void ($('#itemError').textContent = `Another one already has the id "${v.id}".`);
  closeModal();
  change(d => { const l = at(path, d); if (isNew) l.push(v); else if (copy) l.splice(i + 1, 0, v); else l[i] = v; });
  toast(isNew ? 'Added' : copy ? 'Copied' : 'Saved');
}
function editValue(path) {
  modalState = { path, value: true };
  modal(`<h3>Change: ${esc(path)}</h3>
    <textarea class="json" id="itemJson" spellcheck="false">${esc(pretty(at(path) ?? {}))}</textarea>
    <p class="form-error" id="itemError"></p>
    <div class="modal-actions"><button class="btn primary" data-act="item-save">Save</button><button class="btn" data-act="modal-close">Cancel</button></div>`);
}
function showChecks() {
  const list = lint(D);
  modal(`<h3>${list.length ? `${list.length} thing${list.length > 1 ? 's' : ''} to look at` : 'Everything links up'}</h3>
    <p class="small muted">The board checks that every link points somewhere, nothing loops, and money alone never opens a step.</p>
    ${list.length ? `<ul class="checks">${list.map((p, i) => `<li><span>${p.level === 'error' ? '⛔' : '⚠️'}</span><span>${esc(p.text)}</span>
      ${p.go ? `<button class="btn small" data-act="check-go" data-i="${i}">Show me</button>` : '<span></span>'}</li>`).join('')}</ul>`
      : '<p>✓ No broken links, no loops, and no step that money alone opens.</p>'}
    <div class="modal-actions"><button class="btn" data-act="modal-close">Close</button></div>`);
  modalState = { checks: list };
}
function mapHelp() {
  modal(`<h3>How to read the map</h3>
    <p><b>Columns</b> are life stages, toddler to elder. <b>Rows</b> are tracks: kinds of life (street, family, papers, school, trades, work, community).</p>
    <p><b>Arrows</b> lead from a step to the steps that come after it. A dashed arrow means any one of those steps is enough. <b>BY AGE</b> steps need nothing before them: they open at that life stage.</p>
    <p>The <b>six icons</b> on a step show what it asks for: ${D.dimensions.map(x => `${esc(x.icon)} ${esc(x.name.toLowerCase())}`).join(', ')}. A red <b>MONEY ONLY</b> tag means money alone opens it, which the design avoids.</p>
    <p><b>Click</b> a step to see it, with everything before and after it lit up. <b>Drag</b> to move around; <b>⌘ + scroll</b> (or pinch) zooms. Click a kind at the top to light up the steps that ask for it.</p>
    <div class="modal-actions"><button class="btn primary" data-act="modal-close">Got it</button></div>`);
}

// ---- what every button and box does ----
const ACTS = {
  tab: t => setTab(t.dataset.tab),
  go: t => goTo(t.dataset.tab, t.dataset.id),
  select: t => select(t.dataset.id),
  pick: () => pickFile(),
  'use-backup': () => { const b = readBackup(); if (b) { mode = 'download'; handle = null; open(b.text); } },
  restore: () => { const b = pendingBackup; closeModal(); if (b) { undo.push(JSON.stringify(D)); D = normalise(JSON.parse(b.text)); touched(); toast('Brought back'); } },
  'discard-backup': () => { closeModal(); writeBackup(false); },
  save: () => save(),
  undo: () => step(undo, redo),
  redo: () => step(redo, undo),
  download: () => download(pretty(D) + '\n'),
  checks: () => showChecks(),
  'check-go': t => { const p = modalState.checks[+t.dataset.i]; closeModal(); goTo(p.go.tab, p.go.id); },
  'modal-bg': (t, e) => { if (e.target === t) closeModal(); },
  'modal-close': () => closeModal(),
  'edit-item': t => editItem(t.dataset.path, +t.dataset.i),
  'add-item': t => editItem(t.dataset.path),
  'edit-value': t => editValue(t.dataset.path),
  'item-save': () => saveItem(false),
  'item-dup': () => saveItem(true),
  'item-del': () => { const { path, i } = modalState; closeModal(); change(d => at(path, d).splice(i, 1)); toast('Deleted'); },
  'map-help': () => mapHelp(),
  'new-branch': () => { if (!editing || leaveEdit()) newDraft(''); },
  'add-after': () => newDraft(selected),
  'edit-opp': () => startEdit(byId(D.opportunities)[selected]),
  'remove-opp': () => askRemove(),
  'remove-one': () => removeSteps([modalState.id]),
  'remove-branch': () => removeSteps([...branchOf(D, modalState.id)]),
  'save-opp': () => saveOpp(),
  'cancel-edit': () => { editing = null; renderDrawer(); },
  'close-drawer': () => { if (editing && !leaveEdit()) return; editing = null; selected = ''; refreshMarks(); renderDrawer(); },
  'req-add': () => { editing.requires.push({ kind: 'skills', what: '' }); renderDrawer(); $$('#drawer [data-input=req]').pop()?.focus(); },
  'req-del': t => { editing.requires.splice(+t.dataset.i, 1); renderDrawer(); },
  'after-del': t => { editing.after = editing.after.filter(x => x !== t.dataset.id); renderDrawer(); },
  dim: t => { focusDim = focusDim === t.dataset.id ? '' : t.dataset.id; for (const c of $$('.dims .chip')) c.classList.toggle('on', c.dataset.id === focusDim); refreshMarks(); },
  'zoom-in': () => setZoom(zoom * 1.15),
  'zoom-out': () => setZoom(zoom / 1.15),
  'zoom-fit': () => { const box = $('.map-scroll'); if (box && layout) setZoom(Math.min(1, (box.clientWidth - 16) / layout.width)); },
  'sim-trait': t => { const id = t.dataset.id; sim.traits = sim.traits.includes(id) ? sim.traits.filter(x => x !== id) : [...sim.traits, id]; drawSim(); },
  'sim-has': t => { const id = t.dataset.id; sim.has = sim.has.includes(id) ? sim.has.filter(x => x !== id) : [...sim.has, id]; drawSim(); },
  'sim-step': () => { simStep(); drawSim(); },
  'sim-day': () => { simDay(); drawSim(); },
  'sim-reset': () => { sim = newSim(sim.stage); drawSim(); },
  'apply-json': () => {
    let v;
    try { v = JSON.parse($('#allJson').value); } catch (e) { $('#allError').textContent = e.message; return; }
    if (!v || !Array.isArray(v.opportunities)) { $('#allError').textContent = 'It needs an "opportunities" list.'; return; }
    undo.push(JSON.stringify(D)); redo = [];
    D = normalise(v);
    touched();
    toast('Using the changes');
  },
  'reset-json': () => { $('#allJson').value = pretty(D); $('#allError').textContent = ''; },
  'job-status': t => change(d => { const j = d.jobs[+t.dataset.i]; j.status = NEXT_STATUS[j.status] || 'todo'; }),
  'job-up': t => moveJob(+t.dataset.i, -1),
  'job-down': t => moveJob(+t.dataset.i, 1),
  'use-go': t => {
    const id = t.dataset.id, where = {
      needs: ['needs', `need-${id}`], steps: ['progress', id], actions: ['world', `action-${id}`], places: ['world', `place-${id}`],
      coasters: ['world', `coaster-${id}`], events: ['world', `event-${id}`], achievements: ['progress', 'achievements'],
      skills: ['progress', 'skills'], moodlets: ['needs', 'moodlets'] }[t.dataset.kind];
    if (where) goTo(where[0], where[1]);
  }
};
const INPUTS = {
  f: t => {
    editing[t.dataset.k] = t.value;
    if (t.dataset.k === 'name' && editing._isNew && !editing._idTouched) {
      editing.id = uniqueId(slug(t.value) || 'step', new Set(D.opportunities.map(o => o.id)));
      $('#idBox').value = editing.id;
    }
  },
  'f-lines': t => { editing[t.dataset.k] = t.value.split('\n'); },
  'f-id': t => { editing.id = t.value.trim(); editing._idTouched = true; },
  req: t => { editing.requires[+t.dataset.i].what = t.value; $('#mixNote').innerHTML = mixNote(editing); },
  'map-search': t => { query = t.value; refreshMarks(); },
  'sim-need': t => { sim.needs[t.dataset.id] = +t.value; t.nextElementSibling.textContent = t.value; drawChoices(); },
  'sim-money': t => { sim.money = Math.max(0, +t.value || 0); $('#simMoney').textContent = `GH₵ ${sim.money}`; drawChoices(); },
  notes: t => {
    if (!notesSnap) { undo.push(JSON.stringify(D)); redo = []; notesSnap = true; }
    D.story.notes = t.value;
    touched(false);
  }
};
const CHANGES = {
  f: t => { editing[t.dataset.k] = t.value; },
  'f-any': t => { editing.afterAny = t.checked; },
  'req-kind': t => { editing.requires[+t.dataset.i].kind = t.value; renderDrawer(); },
  'after-add': t => { if (t.value) { editing.after.push(t.value); renderDrawer(); } },
  'file-input': t => readPicked(t),
  'sim-stage': t => { sim.stage = t.value; sim.routine = firstRoutine(sim.stage); render(); },
  'sim-routine': t => { sim.routine = t.value; drawChoices(); },
  'sim-weekday': t => { sim.time = (Math.floor(sim.time / 1440) - DAYS.indexOf(dayOf(sim.time)) + +t.value) * 1440 + (((sim.time % 1440) + 1440) % 1440); drawSim(); },
  'sim-clock': t => { sim.clock = t.checked; drawChoices(); },
  'sim-time': t => {
    const [h, m] = t.value.split(':').map(Number);
    if (!Number.isNaN(h)) { sim.time = Math.floor(sim.time / 1440) * 1440 + h * 60 + (m || 0); drawSim(); }
  },
  'world-stage': t => { worldStage = t.value; render(); },
  'world-need': t => { worldNeed = t.value; render(); }
};
const isTyping = el => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
function bindEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t && ACTS[t.dataset.act]) ACTS[t.dataset.act](t, e);
  });
  document.addEventListener('input', e => { const t = e.target.closest('[data-input]'); if (t && INPUTS[t.dataset.input]) INPUTS[t.dataset.input](t, e); });
  document.addEventListener('change', e => { const t = e.target.closest('[data-change]'); if (t && CHANGES[t.dataset.change]) CHANGES[t.dataset.change](t, e); });
  document.addEventListener('focusout', e => { if (e.target.matches?.('[data-input=notes]')) notesSnap = false; });
  document.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey, key = e.key.toLowerCase();
    if (mod && key === 's') { e.preventDefault(); if (D) save(); }
    else if (mod && key === 'z' && D && !isTyping(e.target)) { e.preventDefault(); e.shiftKey ? step(redo, undo) : step(undo, redo); }
    else if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if (selected || editing) ACTS['close-drawer'](); }
    else if (e.key === 'Enter' && e.target.matches?.('.search')) { const hit = $('.node:not(.dim)'); if (hit && query.trim()) select(hit.dataset.id); }
  });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('resize', () => { const box = $('.map-scroll'); if (box) box.style.height = `calc(100vh - ${$('#top').offsetHeight + $('.map-tools').offsetHeight}px)`; });
}

if (typeof document !== 'undefined') start();
</script>
