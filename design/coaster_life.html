<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaster Life · Gold Coast</title>
<!--
  Coaster Life: Gold Coast's design board. Everything on it comes from coaster_life.json (next to this file),
  and every change made on it goes back into that file. See design/README.md for how to open it.
-->
<style>
:root {
  --paper: #faf4e8; --paper-2: #f2e7d2; --card: #fffcf6; --ink: #2b211a; --ink-2: #5c4b3d; --muted: #8a7766;
  --line: #e8dcc6; --gold: #e3a21a; --gold-soft: #f8e6b8; --green: #1d6b3a; --green-soft: #dcefe0;
  --red: #b23a2e; --red-soft: #f7dfda; --head-h: 112px;
  --shadow: 0 1px 2px rgba(70, 45, 20, .07), 0 8px 24px rgba(70, 45, 20, .07);
  --shadow-lift: 0 2px 4px rgba(70, 45, 20, .1), 0 16px 36px rgba(70, 45, 20, .14);
  --r: 14px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.55 var(--sans);
  background:
    radial-gradient(1100px 520px at 105% -8%, rgba(227, 162, 26, .11), transparent 62%),
    radial-gradient(900px 520px at -8% 108%, rgba(29, 107, 58, .08), transparent 62%),
    var(--paper);
  background-attachment: fixed;
}
h1, h2, h3 { font-family: var(--serif); margin: 0; line-height: 1.18; font-weight: 700; }
h2 { font-size: 28px; }
h3 { font-size: 18.5px; }
h4 { margin: 16px 0 7px; font: 700 11.5px/1.3 var(--sans); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
p { margin: 0 0 10px; }
ul { margin: 0; padding-left: 18px; }
code { font: 12.5px var(--mono); background: var(--paper-2); padding: 1px 5px; border-radius: 5px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.spacer { flex: 1; }
[hidden] { display: none !important; }

/* ---------- the top bar ---------- */
header.top {
  position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--line);
  background: rgba(250, 244, 232, .9); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
}
.kente {
  height: 12px; position: relative;
  background: repeating-linear-gradient(90deg, #1c1a17 0 8px, #e3a21a 8px 30px, #1d6b3a 30px 38px, #e3a21a 38px 60px, #b23a2e 60px 68px, #e3a21a 68px 90px);
}
.kente::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .2) 0 2px, transparent 2px 4px); }
.kente::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 88px, #1c1a17 88px 90px); }
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 24px 6px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 2px 4px rgba(60, 40, 20, .18)); }
.brand h1 { font-size: 23px; }
.brand .sub { margin: 1px 0 0; font-size: 13px; color: var(--muted); max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 4px; padding: 4px 20px 10px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 7px 15px; border-radius: 999px; font-weight: 650; font-size: 14px; color: var(--ink-2); white-space: nowrap; transition: background .15s, color .15s; }
.tab:hover { background: var(--paper-2); }
.tab.on { background: var(--ink); color: #fff6df; }
body.welcoming .tabs, body.welcoming .bar .status, body.welcoming .bar .btn { display: none; }

/* ---------- buttons, chips, pills ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card);
  padding: 7px 13px; border-radius: 10px; font-size: 14px; font-weight: 650; color: var(--ink-2);
  transition: transform .12s, box-shadow .12s, background .12s;
}
.btn:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.gold { background: var(--gold); border-color: #c98c10; color: var(--ink); }
.btn.danger { color: var(--red); border-color: #ecc8c2; }
.btn.small { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--paper-2); box-shadow: none; }
.status { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); font-weight: 650; white-space: nowrap; border: 0; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.status.ok { background: var(--green-soft); color: var(--green); }
.status.dirty { background: var(--gold-soft); color: #845400; }
.status.bad { background: var(--red-soft); color: var(--red); }
button.status:hover { filter: brightness(.97); }
.chip {
  --c: #8a7766; display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 650; white-space: nowrap; line-height: 1.6;
  background: color-mix(in srgb, var(--c) 13%, white); color: color-mix(in srgb, var(--c) 78%, black);
  border: 1px solid color-mix(in srgb, var(--c) 26%, white);
}
button.chip { cursor: pointer; transition: transform .1s, box-shadow .1s; }
button.chip:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(60, 40, 20, .12); }
.chip.on, .chip.toggle.on { background: var(--c); color: #fff; border-color: var(--c); }
.chip.toggle:not(.on) { --c: #8a7766; }
.chip.bad { --c: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pills { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.up { background: #dcefe0; color: #1d6b3a; }
.pill.down { background: #f7dfda; color: #a3352a; }
.pill.cedi { background: #f8e6b8; color: #7a5200; }
.pill.cost { background: #efe6d6; color: #6b5640; }
.pill i { font-style: normal; opacity: .65; font-weight: 600; margin-left: 3px; }
.lock { border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
button.lock:hover { color: var(--green); text-decoration: underline; }
.warn-note { font-size: 13px; background: #fbf0dd; border-radius: 9px; padding: 7px 10px; color: #7a4b00; margin: 8px 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

/* ---------- page layout ---------- */
main { padding: 26px 28px 90px; max-width: 1440px; margin: 0 auto; }
main.wide { max-width: none; padding: 0; }
.section { margin: 0 0 38px; }
.section-head { display: flex; align-items: flex-end; gap: 14px; margin: 0 0 14px; flex-wrap: wrap; }
.section-head p { margin: 4px 0 0; color: var(--muted); max-width: 820px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 280px), 1fr)); }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); }
.card.accent { border-top: 4px solid var(--c, var(--gold)); }
.card h3 { margin: 0 0 6px; padding-right: 26px; }
.card.mini { padding: 12px 14px; }
.card.mini p { margin: 4px 0 0; }
.edit { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s; z-index: 2; }
.card:hover > .edit, .stage:hover > .edit, .edit:focus { opacity: 1; }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--gold), var(--shadow-lift); } 100% { box-shadow: var(--shadow); } }
.lead { font-size: 16.5px; color: var(--ink-2); max-width: 680px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }

/* ---------- overview ---------- */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 30px; align-items: center; margin-bottom: 30px; }
.hero h2 { font-size: 44px; margin-bottom: 10px; }
.proverb { font-family: var(--serif); font-size: 20px; font-style: italic; color: var(--ink-2); border-left: 4px solid var(--gold); padding: 4px 0 4px 16px; margin: 18px 0 0; }
.proverb small { display: block; font: 13px/1.4 var(--sans); color: var(--muted); margin-top: 4px; }
.loop svg { display: block; width: 100%; height: auto; }
.systems { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 38px; }
.system { cursor: pointer; transition: transform .15s, box-shadow .15s; padding-bottom: 46px; }
.system:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.system .q { font-family: var(--serif); font-size: 18px; font-style: italic; color: var(--ink-2); margin: 4px 0 10px; }
.sys-n { position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 800; }
.stats { display: flex; gap: 20px; margin-top: 12px; }
.stat b { display: block; font: 700 24px/1 var(--serif); }
.stat span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.system .go { position: absolute; bottom: 14px; right: 18px; font-weight: 700; color: var(--c); font-size: 14px; }
.dim-icon { font-size: 26px; line-height: 1; margin-bottom: 8px; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.stage { position: relative; padding: 16px; color: #fff; background: var(--c); min-height: 150px; }
.stage b { display: block; font: 700 19px/1.2 var(--serif); }
.stage .ages { font-size: 12px; opacity: .85; }
.stage p { font-size: 13px; margin: 8px 0 0; opacity: .95; }
.stage .edit { color: #fff; }
.help p { margin: 0 0 8px; }

/* ---------- needs and the simulator ---------- */
.tier { margin-bottom: 26px; }
.tier-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.tier-head .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); align-self: center; }
.need { border-top: 4px solid var(--c); }
.need-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.need-top .icon, .trait-top .icon { font-size: 28px; line-height: 1; }
.need-top h3 { margin: 0; }
.local { font: italic 14px var(--serif); color: var(--muted); }
.decay { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin: 10px 0 4px; }
.decay i { flex: 1; min-height: 2px; border-radius: 3px 3px 0 0; background: color-mix(in srgb, var(--c) 28%, white); }
.decay i.on { background: var(--c); }
.ways { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.ways li { display: flex; gap: 7px; align-items: center; padding: 4px 0; border-top: 1px dashed var(--line); }
.ways li .lock { margin-left: auto; }
.trait-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.trait-top h3 { margin: 0; }
.sim { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; gap: 16px; align-items: start; }
.sim-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
.sim-row label { font-weight: 650; color: var(--ink-2); }
.sim-row input.num { width: 76px; }
.sim input[type=number], .sim input[type=time], .sim select, .filters select {
  border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 8px; font-size: 13px;
}
.sliders { display: grid; gap: 2px; margin: 6px 0 4px; }
.slider { display: grid; grid-template-columns: 22px 84px 1fr 30px; align-items: center; gap: 6px; font-size: 13px; }
.slider input { width: 100%; accent-color: var(--c); }
.slider b { text-align: right; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.sim-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.sim-head .clock { font: 700 18px var(--serif); }
.choice { display: grid; grid-template-columns: 26px 1fr 130px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.choice + .choice { margin-top: 2px; }
.choice.top { background: #fdf3da; border-color: #f2dda4; }
.choice.locked { opacity: .6; }
.choice .rank { font: 700 15px var(--serif); color: var(--muted); text-align: center; }
.choice .parts { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.score { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
.score .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.score .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--green)); }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 650; padding: 6px 2px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; font-size: 13px; border-top: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.log time { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.log .empty { color: var(--red); font-weight: 650; }
.routine ol { list-style: none; margin: 8px 0 0; padding: 0; border-left: 2px solid color-mix(in srgb, var(--c) 40%, white); }
.routine li { position: relative; padding: 3px 0 3px 14px; font-size: 13px; }
.routine li::before { content: ""; position: absolute; left: -5px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.routine li b { font-variant-numeric: tabular-nums; margin-right: 6px; }
.mood { display: flex; gap: 10px; align-items: flex-start; }
.mood .v { font: 700 15px var(--serif); min-width: 38px; text-align: center; padding: 2px 0; border-radius: 8px; }
.mood .v.up { background: var(--green-soft); color: var(--green); }
.mood .v.down { background: var(--red-soft); color: var(--red); }
.numbers { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.numbers b { font-variant-numeric: tabular-nums; }
</style>
<style>
/* ---------- the life map ---------- */
.map-tools {
  position: sticky; top: var(--head-h); z-index: 12; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 22px; background: rgba(250, 244, 232, .96); border-bottom: 1px solid var(--line);
}
.map-tools .search { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 5px 10px; width: 190px; font-size: 13px; }
.moneycheck { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.moneycheck.ok { background: var(--green-soft); color: var(--green); }
.moneycheck.bad { background: var(--red-soft); color: var(--red); }
.zoom { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.zoom span { min-width: 42px; text-align: center; }
.map-scroll { position: relative; overflow: auto; cursor: grab; height: 70vh; background: #fbf7ee; }
.map-scroll.panning { cursor: grabbing; user-select: none; }
.map { position: relative; transform-origin: 0 0; }
.map > svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.band { position: absolute; top: 0; background: color-mix(in srgb, var(--c) 6%, transparent); border-left: 1px dashed color-mix(in srgb, var(--c) 35%, transparent); }
.col-head { position: absolute; top: 12px; padding: 4px 18px; }
.col-head b { display: block; font: 700 19px/1.2 var(--serif); color: color-mix(in srgb, var(--c) 82%, black); }
.col-head span { font-size: 12px; color: var(--muted); }
.col-head::after { content: ""; display: block; width: 46px; height: 4px; border-radius: 2px; background: var(--c); margin-top: 6px; }
.row-line { position: absolute; left: 0; border-top: 1px solid rgba(120, 90, 50, .13); }
.row-label { position: absolute; left: 0; width: 150px; display: flex; align-items: center; padding: 0 12px 0 16px; }
.row-label span { font-weight: 750; font-size: 13px; line-height: 1.25; padding-left: 9px; border-left: 4px solid var(--c); color: color-mix(in srgb, var(--c) 78%, black); }
.node {
  --c: #8a7766; position: absolute; width: 184px; height: 66px; display: flex; flex-direction: column; justify-content: space-between;
  padding: 7px 10px 6px 11px; border-radius: 11px; cursor: pointer; background: #fffdf8;
  border: 1.5px solid color-mix(in srgb, var(--c) 40%, white); border-left: 6px solid var(--c);
  box-shadow: 0 1px 2px rgba(60, 40, 20, .08); transition: box-shadow .15s, transform .15s, opacity .2s;
}
.node:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); z-index: 3; }
.node .nm { font-weight: 680; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .req { display: flex; gap: 3px; font-size: 11.5px; line-height: 1; }
.node .req span { opacity: .16; filter: grayscale(1); }
.node .req span.on { opacity: 1; filter: none; }
.node .tag { position: absolute; top: -9px; right: 8px; font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; background: var(--gold); color: var(--ink); }
.node .tag.warn { background: var(--red); color: #fff; }
.node .tag.age { background: #efe4cf; color: #6b5640; }
.node.start { background: linear-gradient(135deg, #fff3d2, #fffdf8 70%); border-color: var(--gold); }
.node.sel { box-shadow: 0 0 0 3px var(--gold), var(--shadow-lift); z-index: 4; }
.node.path { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 65%, white); }
.node.dim { opacity: .25; }
.edge { fill: none; stroke: #cdb995; stroke-width: 1.7; transition: opacity .2s; }
.edge.any { stroke-dasharray: 5 5; }
.edge.hot { stroke: var(--gold); stroke-width: 2.8; }
.edge.dim { opacity: .15; }
.below { padding: 30px 28px 90px; max-width: 1440px; margin: 0 auto; }
.ladder { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.rung { padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13.5px; color: #fff; background: color-mix(in srgb, #c2507a calc(35% + var(--i) * 16%), #e9c9b0); }
.ladder .arrow { color: var(--muted); }

/* ---------- the drawer (one step, or its form) ---------- */
.drawer {
  position: fixed; top: var(--head-h); right: 0; bottom: 0; width: 440px; max-width: 94vw; z-index: 40; overflow-y: auto;
  padding: 18px 24px 40px; background: var(--card); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(60, 40, 20, .13);
  transform: translateX(105%); transition: transform .25s ease;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.d-title { font-size: 26px; margin: 10px 0 8px; }
.d-summary { font: 16px/1.5 var(--serif); color: var(--ink-2); }
.req-group { display: grid; grid-template-columns: 30px 1fr; gap: 4px 6px; padding: 8px 10px; margin: 6px 0; border-radius: 10px; background: color-mix(in srgb, var(--c) 8%, white); }
.req-group .ri { font-size: 18px; line-height: 1.3; }
.req-group b { font-size: 13px; color: color-mix(in srgb, var(--c) 80%, black); }
.req-group ul { font-size: 14px; }
.drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 12px; }
.unlocks li { margin: 2px 0; }
.form label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 13px 0 4px; }
.form label.check { display: flex; font-weight: 500; margin-top: 8px; }
.form input[type=text], .form select, .form textarea {
  width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 10px; font-size: 14px;
}
.form textarea { resize: vertical; min-height: 64px; }
.form input:focus, .form select:focus, .form textarea:focus, .search:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
.req-row { display: grid; grid-template-columns: 150px 1fr 30px; gap: 6px; margin-bottom: 6px; }
.mix { display: flex; align-items: center; gap: 4px; margin: 8px 0 0; font-size: 15px; }
.mix span { opacity: .18; filter: grayscale(1); }
.mix span.on { opacity: 1; filter: none; }
.mix .small { opacity: 1; filter: none; margin-left: 6px; }
.form-error { color: var(--red); font-weight: 650; font-size: 13.5px; min-height: 1px; margin: 10px 0 0; }

/* ---------- modal and toast ---------- */
.modal-back { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; background: rgba(43, 33, 26, .38); backdrop-filter: blur(3px); }

<script>
'use strict';
const FILE = 'coaster_life.json';
const BACKUP_KEY = 'coaster-life-backup';
const WIDTH = 100;                                  // pretty() keeps a [...] or {...} on one line if it fits in this
const NODE_W = 184, NODE_H = 66, GAP_X = 34, GAP_Y = 14; // the life map's steps, and the space between them
const LEFT = 172, TOP = 80, STAGE_PAD = 24, ROW_PAD = 16;

/* ================= The logic: nothing here touches the page ================= */

const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function byId(list) {
  const m = Object.create(null);
  for (const x of list || []) if (x && x.id !== undefined && !(x.id in m)) m[x.id] = x;
  return m;
}
const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
function uniqueId(base, taken) {
  base = base || 'new';
  let id = base, n = 2;
  while (taken.has(id)) id = `${base}_${n++}`;
  return id;
}
const hhmm = m => {
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
};
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

// The JSON file's layout: short lists and objects on one line, long ones one item a line.
function inline(v) {
  if (Array.isArray(v)) return '[' + v.map(x => x === undefined ? 'null' : inline(x)).join(', ') + ']';
  if (v && typeof v === 'object') {
    const keys = Object.keys(v).filter(k => v[k] !== undefined);
    return keys.length ? '{' + keys.map(k => JSON.stringify(k) + ': ' + inline(v[k])).join(', ') + '}' : '{}';
  }
  return JSON.stringify(v) ?? 'null';
}
function pretty(v, indent = '', used = 0) {
  const one = inline(v);
  if (!v || typeof v !== 'object' || indent.length + used + one.length <= WIDTH) return one;
  const inner = indent + '  ';
  const items = Array.isArray(v)
    ? v.map(x => inner + (x === undefined ? 'null' : pretty(x, inner)))
    : Object.keys(v).filter(k => v[k] !== undefined).map(k => {
        const key = JSON.stringify(k) + ': ';
        return inner + key + pretty(v[k], inner, key.length);
      });
  if (!items.length) return one;
  return (Array.isArray(v) ? '[' : '{') + '\n' + items.join(',\n') + '\n' + indent + (Array.isArray(v) ? ']' : '}');
}

// ---- the life map's links ----
const isMoneyOnly = o => {
  const kinds = (o.requires || []).map(r => r.kind);
  return kinds.length > 0 && kinds.every(k => k === 'resources');
};
const reqsOf = a => [].concat(a.requires || []).filter(Boolean); // the step that opens an action (any one, if there are several)
const childrenOf = (d, id) => d.opportunities.filter(o => (o.after || []).includes(id));
function ancestors(d, id) {
  const m = byId(d.opportunities), seen = new Set(), todo = [id];
  while (todo.length) {
    const o = m[todo.pop()];
    for (const p of (o && o.after) || []) if (!seen.has(p)) { seen.add(p); todo.push(p); }
  }
  seen.delete(id);
  return seen;
}
function descendants(d, id) {
  const kids = {};
  for (const o of d.opportunities) for (const p of o.after || []) (kids[p] = kids[p] || []).push(o.id);
  const seen = new Set(), todo = [id];
  while (todo.length) for (const k of kids[todo.pop()] || []) if (!seen.has(k)) { seen.add(k); todo.push(k); }
  seen.delete(id);
  return seen;
}
// A branch: the step, and every step after it that would have nothing left before it.
function branchOf(d, id) {
  const gone = new Set([id]);
  for (let grew = true; grew;) {
    grew = false;
    for (const o of d.opportunities) {
      const after = o.after || [];
      if (!gone.has(o.id) && after.length && after.every(p => gone.has(p))) { gone.add(o.id); grew = true; }
    }
  }
  return gone;
}
// Takes steps out of the design, and every link to them.
function removeOpps(d, ids) {
  const gone = new Set(ids);
  d.opportunities = d.opportunities.filter(o => !gone.has(o.id));
  for (const o of d.opportunities) if (o.after) o.after = o.after.filter(p => !gone.has(p));
  for (const a of d.achievements || []) a.unlocks = (a.unlocks || []).filter(x => !gone.has(x));
  for (const c of d.story?.chapters || []) c.goals = (c.goals || []).filter(x => !gone.has(x));
  for (const s of d.story?.origins || []) {
    s.firstGoals = (s.firstGoals || []).filter(x => !gone.has(x));
    if (gone.has(s.start)) s.start = '';
  }
  for (const a of d.actions || []) {
    if (Array.isArray(a.requires)) a.requires = a.requires.filter(x => !gone.has(x));
    else if (gone.has(a.requires)) a.requires = '';
    if (gone.has(a.until)) a.until = '';
  }
  for (const s of d.story?.origins || []) if (s.alreadyDone) s.alreadyDone = s.alreadyDone.filter(x => !gone.has(x));
  for (const j of d.jobs || []) if (j.uses?.steps) j.uses.steps = j.uses.steps.filter(x => !gone.has(x));
}
// Gives a step a new id, and every link to it.
function renameOpp(d, from, to) {
  if (from === to) return;
  const swap = x => x === from ? to : x;
  for (const o of d.opportunities) { if (o.id === from) o.id = to; if (o.after) o.after = o.after.map(swap); }
  for (const a of d.achievements || []) a.unlocks = (a.unlocks || []).map(swap);
  for (const c of d.story?.chapters || []) c.goals = (c.goals || []).map(swap);
  for (const s of d.story?.origins || []) { s.firstGoals = (s.firstGoals || []).map(swap); if (s.start === from) s.start = to; }
  for (const a of d.actions || []) {
    if (Array.isArray(a.requires)) a.requires = a.requires.map(swap); else if (a.requires === from) a.requires = to;
    if (a.until === from) a.until = to;
  }
  for (const s of d.story?.origins || []) if (s.alreadyDone) s.alreadyDone = s.alreadyDone.map(swap);
  for (const j of d.jobs || []) if (j.uses?.steps) j.uses.steps = j.uses.steps.map(swap);
}

// Where each step goes on the map: life stages are columns, tracks are rows. Inside a stage, a step
// that comes after another step of the same stage goes one place to the right of it.
function layoutMap(d) {
  const stages = d.lifeStages.map(s => s.id), tracks = d.tracks.map(t => t.id);
  const opps = d.opportunities, n = opps.length, idx = {};
  opps.forEach((o, i) => { if (!(o.id in idx)) idx[o.id] = i; });
  const col = opps.map(o => { const i = stages.indexOf(o.stage); return i < 0 ? stages.length : i; });
  const row = opps.map(o => { const i = tracks.indexOf(o.track); return i < 0 ? tracks.length : i; });
  const sub = new Array(n).fill(-1), busy = new Array(n).fill(false);
  const depth = i => {
    if (sub[i] >= 0) return sub[i];
    if (busy[i]) return 0; // a loop: the checks report it
    busy[i] = true;
    let k = 0;
    for (const p of opps[i].after || []) {
      const j = idx[p];
      if (j !== undefined && j !== i && col[j] === col[i]) k = Math.max(k, depth(j) + 1);
    }
    busy[i] = false;
    return (sub[i] = k);
  };
  for (let i = 0; i < n; i++) depth(i);
  const nCols = stages.length + (col.includes(stages.length) ? 1 : 0);
  const nRows = tracks.length + (row.includes(tracks.length) ? 1 : 0);
  const subs = Array.from({ length: nCols }, (_, c) => 1 + Math.max(0, ...sub.filter((_, i) => col[i] === c)));
  const colX = [], colW = [];
  let x = LEFT;
  for (let c = 0; c < nCols; c++) { colX.push(x); colW.push(subs[c] * (NODE_W + GAP_X) - GAP_X + STAGE_PAD * 2); x += colW[c]; }
  const slots = {};
  for (let i = 0; i < n; i++) (slots[`${col[i]},${row[i]},${sub[i]}`] ||= []).push(i);
  const rowCount = new Array(nRows).fill(1);
  for (const key in slots) { const r = +key.split(',')[1]; rowCount[r] = Math.max(rowCount[r], slots[key].length); }
  const rowY = [], rowH = [];
  let y = TOP;
  for (let r = 0; r < nRows; r++) { rowY.push(y); rowH.push(rowCount[r] * (NODE_H + GAP_Y) - GAP_Y + ROW_PAD * 2); y += rowH[r]; }
  // Fill the slots left to right; in each, the steps whose parents sit higher go first.
  const px = new Array(n), py = new Array(n);
  const keys = Object.keys(slots).map(k => k.split(',').map(Number)).sort((a, b) => a[0] - b[0] || a[2] - b[2] || a[1] - b[1]);
  for (const [c, r, s] of keys) {
    const list = slots[`${c},${r},${s}`];
    const weight = i => {
      const ys = (opps[i].after || []).map(p => idx[p]).filter(j => j !== undefined && py[j] !== undefined).map(j => py[j]);
      return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : -1;
    };
    const w = new Map(list.map(i => [i, weight(i)]));
    list.sort((a, b) => w.get(a) - w.get(b) || a - b);
    list.forEach((i, k) => { px[i] = colX[c] + STAGE_PAD + s * (NODE_W + GAP_X); py[i] = rowY[r] + ROW_PAD + k * (NODE_H + GAP_Y); });
  }
  const edges = [];
  opps.forEach((o, i) => (o.after || []).forEach(p => {
    const j = idx[p];
    if (j !== undefined && j !== i) edges.push({ from: j, to: i, any: !!o.afterAny });
  }));
  return { px, py, idx, edges, colX, colW, rowY, rowH, nCols, nRows, width: x + 30, height: y + 30 };
}
function edgePath(x1, y1, x2, y2) {
  if (x2 > x1 + 12) {
    const dx = Math.max(28, (x2 - x1) / 2);
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  }
  return `M${x1},${y1} C${x1 + 90},${y1 - 50} ${x2 - 90},${y2 - 50} ${x2},${y2}`; // drawn backwards: the checks say why
}

// ---- the checks: every link points somewhere, nothing loops, money alone opens nothing ----
function lint(d) {
  const out = [];
  const add = (level, text, go) => out.push({ level, text, go });
  const ids = (list, what) => {
    const seen = new Set();
    for (const x of list || []) {
      if (!x || x.id === undefined || x.id === '') add('error', `A ${what} has no id.`);
      else if (seen.has(x.id)) add('error', `Two ${what}s share the id "${x.id}".`);
      else seen.add(x.id);
    }
    return seen;
  };
  const stages = ids(d.lifeStages, 'life stage'), tracks = ids(d.tracks, 'track'), dims = ids(d.dimensions, 'dimension');
  const places = ids(d.places, 'place'), actions = ids(d.actions, 'action'), needs = ids(d.needs, 'need');
  const traits = ids(d.traits, 'trait'), tiers = ids(d.needTiers, 'need tier');
  ids(d.opportunities, 'step');
  const achievements = ids(d.achievements, 'achievement'), events = ids(d.events, 'event'), coasters = ids(d.coasters, 'Coaster');
  const skills = ids(d.skills, 'skill'), moodlets = ids(d.moodlets, 'moodlet');
  const jobs = ids(d.jobs, 'job'), parts = ids(d.buildParts, 'part of the plan'), lessons = ids(d.tutorial, 'lesson');
  const rels = new Set((d.relationshipTypes || []).map(r => r.id));
  const order = Object.fromEntries((d.lifeStages || []).map((s, i) => [s.id, i]));
  const m = byId(d.opportunities);
  for (const o of d.opportunities || []) {
    const go = { tab: 'progress', id: o.id }, nm = `"${o.name || o.id}"`;
    if (!stages.has(o.stage)) add('error', `${nm} has a life stage that doesn't exist ("${o.stage}").`, go);
    if (!tracks.has(o.track)) add('error', `${nm} has a track that doesn't exist ("${o.track}").`, go);
    for (const p of o.after || []) {
      if (p === o.id) add('error', `${nm} comes after itself.`, go);
      else if (!m[p]) add('error', `${nm} comes after "${p}", and no step has that id.`, go);
      else if (order[m[p].stage] > order[o.stage]) add('warn', `${nm} is ${o.stage}, but comes after "${m[p].name}", which is later in life (${m[p].stage}).`, go);
    }
    const kinds = new Set((o.requires || []).map(r => r.kind));
    for (const k of kinds) if (!dims.has(k)) add('error', `${nm} asks for a kind of thing that doesn't exist ("${k}").`, go);
    if (!o.start && kinds.size === 0) add('warn', `${nm} asks for nothing. What does it take?`, go);
    if (isMoneyOnly(o)) add('warn', `Only money opens ${nm}. Add a skill, an education, a relationship, a reputation, or a choice.`, go);
    if (o.where && !places.has(o.where)) add('error', `${nm} happens at "${o.where}", and no place has that id.`, go);
  }
  const state = {};
  const visit = id => {
    state[id] = 1;
    for (const p of m[id]?.after || []) {
      if (!m[p] || p === id) continue;
      if (state[p] === 1) add('error', `"${m[id].name}" and "${m[p].name}" come after each other (a loop).`, { tab: 'progress', id });
      else if (!state[p]) visit(p);
    }
    state[id] = 2;
  };
  for (const o of d.opportunities || []) if (!state[o.id]) visit(o.id);
  for (const a of d.achievements || []) for (const u of a.unlocks || [])
    if (!m[u]) add('error', `The achievement "${a.name}" helps open "${u}", and no step has that id.`, { tab: 'progress', id: 'achievements' });
  for (const c of d.story?.chapters || []) {
    if (!stages.has(c.stage)) add('error', `Chapter "${c.name}" has a life stage that doesn't exist ("${c.stage}").`, { tab: 'story', id: `chapter-${c.id}` });
    for (const g of c.goals || []) if (!m[g]) add('error', `Chapter "${c.name}" has the goal "${g}", and no step has that id.`, { tab: 'story', id: `chapter-${c.id}` });
  }
  for (const s of d.story?.origins || []) {
    if (s.start && !m[s.start]) add('error', `The start "${s.name}" begins at "${s.start}", and no step has that id.`, { tab: 'story', id: `origin-${s.id}` });
    for (const g of s.firstGoals || []) if (!m[g]) add('error', `The start "${s.name}" has the goal "${g}", and no step has that id.`, { tab: 'story', id: `origin-${s.id}` });
    for (const g of s.alreadyDone || []) if (!m[g]) add('error', `The start "${s.name}" begins with "${g}" done, and no step has that id.`, { tab: 'story', id: `origin-${s.id}` });
  }
  for (const a of d.actions || []) {
    const go = { tab: 'world', id: `action-${a.id}` }, nm = `The action "${a.name || a.id}"`;
    if (!places.has(a.place)) add('error', `${nm} happens at "${a.place}", and no place has that id.`, go);
    for (const s of a.stages || []) if (!stages.has(s)) add('error', `${nm} lists a life stage that doesn't exist ("${s}").`, go);
    for (const k of Object.keys(a.needs || {})) if (!needs.has(k)) add('error', `${nm} changes a need that doesn't exist ("${k}").`, go);
    for (const x of reqsOf(a)) if (!m[x]) add('error', `${nm} opens with "${x}", and no step has that id.`, go);
    if (a.until && !m[a.until]) add('error', `${nm} stops with "${a.until}", and no step has that id.`, go);
    for (const x of a.days || []) if (!DAYS.includes(x)) add('error', `${nm} has a day the simulator doesn't know ("${x}"). Use ${DAYS.join(', ')}.`, go);
    if (a.trait && !traits.has(a.trait)) add('error', `${nm} is for a trait that doesn't exist ("${a.trait}").`, go);
    if (a.hours && !parseHours(a.hours)) add('warn', `${nm} has hours the simulator can't read ("${a.hours}"). Write them like "07:00 to 12:00".`, go);
    if (a.earns && !(Array.isArray(a.earns) && a.earns.length === 2)) add('error', `${nm} earns something that isn't [least, most].`, go);
  }
  for (const t of d.traits || []) for (const l of t.likes || [])
    if (!actions.has(l)) add('error', `The trait "${t.name}" likes "${l}", and no action has that id.`, { tab: 'needs', id: `trait-${t.id}` });
  for (const p of d.places || []) for (const s of p.stages || [])
    if (!stages.has(s)) add('error', `The place "${p.name}" lists a life stage that doesn't exist ("${s}").`, { tab: 'world', id: `place-${p.id}` });
  for (const e of d.events || []) if (e.place && !places.has(e.place))
    add('error', `The event "${e.name}" happens at "${e.place}", and no place has that id.`, { tab: 'world', id: `event-${e.id}` });
  for (const c of d.coasters || []) {
    const go = { tab: 'world', id: `coaster-${c.id}` };
    if (c.place && !places.has(c.place)) add('error', `${c.name} lives at "${c.place}", and no place has that id.`, go);
    for (const t of c.traits || []) if (!traits.has(t)) add('error', `${c.name} has a trait that doesn't exist ("${t}").`, go);
    if (c.becomes && !rels.has(c.becomes)) add('error', `${c.name} can become "${c.becomes}", which isn't a kind of relationship.`, go);
  }
  const curves = d.decisionModel?.curves || {};
  for (const n of d.needs || []) {
    const go = { tab: 'needs', id: `need-${n.id}` };
    if (!tiers.has(n.tier)) add('error', `The need "${n.name}" is in a tier that doesn't exist ("${n.tier}").`, go);
    for (const s of Object.keys(n.decay || {})) if (!stages.has(s)) add('error', `The need "${n.name}" has a decay for a life stage that doesn't exist ("${s}").`, go);
    if (!(n.curve in curves)) add('warn', `The need "${n.name}" has the curve "${n.curve}", which the decision model doesn't have.`, go);
  }
  for (const r of d.routines || []) {
    const go = { tab: 'needs', id: `routine-${r.id}` };
    if (!stages.has(r.stage)) add('error', `The routine "${r.name}" has a life stage that doesn't exist ("${r.stage}").`, go);
    for (const e of r.schedule || []) for (const x of e.actions || [])
      if (!actions.has(x)) add('error', `The routine "${r.name}" says "${x}" at ${e.time}, and no action has that id.`, go);
  }
  const kinds = { needs, steps: new Set(Object.keys(m)), actions, places, coasters, events, achievements, skills, moodlets };
  for (const j of d.jobs || []) {
    const go = { tab: 'plan', id: `job-${j.id}` }, nm = j.number ? `Job ${j.number}` : `"${j.title || j.id}"`;
    if (!parts.has(j.part)) add('error', `${nm} is in a part of the plan that doesn't exist ("${j.part}").`, go);
    for (const a of j.after || []) if (!jobs.has(a)) add('error', `${nm} comes after "${a}", and no job has that id.`, go);
    for (const [kind, list] of Object.entries(j.uses || {})) {
      if (!kinds[kind]) { add('error', `${nm} brings in a kind of thing the board doesn't know ("${kind}").`, go); continue; }
      for (const x of list) if (!kinds[kind].has(x)) add('error', `${nm} brings in ${kind} "${x}", and nothing has that id.`, go);
    }
  }
  const origins = new Set((d.story?.origins || []).map(o => o.id));
  for (const l of d.tutorial || []) {
    const go = { tab: 'tutorial', id: `lesson-${l.id}` }, nm = `The lesson "${l.title || l.id}"`;
    if (l.origin && !origins.has(l.origin)) add('error', `${nm} is for a start that doesn't exist ("${l.origin}").`, go);
    if (l.job && !jobs.has(l.job)) add('error', `${nm} comes with a job that doesn't exist ("${l.job}").`, go);
    const [kind, rest = ''] = String(l.when || '').split(/:(.*)/s);
    if (kind === 'after' && !lessons.has(rest.trim())) add('error', `${nm} comes after "${rest}", and no lesson has that id.`, go);
    if (kind === 'need below' && !needs.has(rest.trim().split(/\s+/)[0])) add('error', `${nm} waits for a need that doesn't exist ("${rest}").`, go);
    if (kind === 'arrive' && !places.has(rest.trim())) add('error', `${nm} waits for a place that doesn't exist ("${rest}").`, go);
    const p = /^place:(.+)$/.exec(l.point || '');
    if (p && !places.has(p[1])) add('error', `${nm} points at a place that doesn't exist ("${p[1]}").`, go);
  }
  return out;
}

// ---- needs and behaviour: how a Coaster decides what to do next ----
function parseHours(s) {
  const m = /(\d{1,2}):(\d{2})\s*(?:to|-|–)\s*(\d{1,2}):(\d{2})/.exec(s || '');
  return m ? [m[1] * 60 + +m[2], m[3] * 60 + +m[4]] : null;
}
function isOpen(range, t) {
  if (!range) return true;
  const [a, b] = range;
  t = ((t % 1440) + 1440) % 1440;
  return a <= b ? t >= a && t < b : t >= a || t < b;
}
const comfortable = (model, stage) => {
  const c = model.comfortableCedis;
  return typeof c === 'number' ? c : (c && c[stage]) || 50;
};
const cedis = x => 5 * Math.log2(1 + Math.max(0, x) / 5); // what money is worth: more is better, but less and less so
const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const dayOf = t => DAYS[((Math.floor(t / 1440) % 7) + 7) % 7]; // the simulator's day 1 is a Monday
const isSleep = a => (a?.needs?.energy || 0) >= 40;
// Sleep lasts until the Coaster is rested: the share of a sleep action they need now (a quarter at least).
const restOf = (a, s) => isSleep(a) ? clamp((100 - (s.needs.energy ?? 100)) / a.needs.energy, 0.25, 1) : 1;
// The line of the Coaster's routine for now (before the first line of the day, it's still last night's).
function routineNow(d, s) {
  const r = (d.routines || []).find(x => x.id === s.routine);
  const mins = e => { const m = /^(\d{1,2}):(\d{2})/.exec(e.time || ''); return m ? m[1] * 60 + +m[2] : -1; };
  const now = ((s.time % 1440) + 1440) % 1440;
  let cur = null, last = null;
  for (const e of r?.schedule || []) {
    const m = mins(e);
    if (m < 0) continue;
    if (!last || m > mins(last)) last = e;
    if (m <= now && (!cur || m > mins(cur))) cur = e;
  }
  return cur || last;
}

// Scores everything the Coaster could do now, best first (and what they can't do yet, after).
// s = { stage, needs: {id: 0..100}, money, traits: [ids], has: [step ids done], routine (id), time (minutes since Monday 00:00),
//       clock (mind opening hours and days), recent: {action id: when it was last done} }
function scoreActions(d, s) {
  const M = d.decisionModel || {};
  const needs = byId(d.needs), places = byId(d.places), opps = byId(d.opportunities), traits = byId(d.traits);
  const curves = M.curves || {}, weights = M.tierWeights || {};
  const upper = M.maslowTiers || ['heart', 'spirit'], floor = M.maslowFloor ?? 0.3;
  const body = (d.needs || []).filter(n => n.tier === 'survival');
  const fed = body.length ? body.reduce((t, n) => t + (s.needs[n.id] ?? 100) / 100, 0) / body.length : 1;
  const maslow = floor + (1 - floor) * fed; // the heart and the spirit count for more once the body is looked after
  const pressure = clamp(1 - s.money / comfortable(M, s.stage), 0, 1);
  const hurt = (n, v) => 100 * Math.pow(1 - clamp(v, 0, 100) / 100, curves[n.curve] ?? 1.5);
  const plan = routineNow(d, s), planned = new Set(plan?.actions || []);
  const rows = [];
  for (const a of d.actions || []) {
    if (!(a.stages || []).includes(s.stage)) continue;
    const rest = restOf(a, s);
    const r = { a, score: 0, parts: [], lock: '', minutes: Math.max(5, Math.round((a.minutes || 30) * rest)) };
    if (a.trait && !s.traits.includes(a.trait)) r.lock = `Only for ${traits[a.trait]?.name || a.trait} Coasters`;
    else if (reqsOf(a).length && !reqsOf(a).some(x => s.has.includes(x))) r.lock = `Opens with: ${reqsOf(a).map(x => opps[x]?.name || x).join(' or ')}`;
    else if (a.until && s.has.includes(a.until)) r.lock = `Not any more, since: ${opps[a.until]?.name || a.until}`;
    else if ((a.cost || 0) > s.money) r.lock = `Costs GH₵ ${a.cost}`;
    else if (s.clock && !isOpen(parseHours(a.hours) || parseHours(places[a.place]?.hours), s.time)) r.lock = `Not at ${hhmm(s.time)}`;
    else if (s.clock && a.days && !a.days.includes(dayOf(s.time))) r.lock = `Only on ${a.days.map(x => DAY_NAMES[DAYS.indexOf(x)] || x).join(', ')}`;
    for (const [id, full] of Object.entries(a.needs || {})) {
      const n = needs[id], delta = Math.round(full * rest);
      if (!n || !delta) continue;
      const v = s.needs[id] ?? 100;
      const w = (weights[n.tier] ?? 1) * (upper.includes(n.tier) ? maslow : 1);
      const pts = delta > 0 ? w * (hurt(n, v) - hurt(n, v + delta)) : -w * (M.lossWeight ?? 0.6) * (hurt(n, v + delta) - hurt(n, v));
      r.score += pts;
      r.parts.push({ text: `${delta > 0 ? '+' : ''}${delta} ${n.name}`, pts, up: delta > 0 });
    }
    if (a.earns) {
      const pts = (M.earnWeight ?? 2) * cedis((a.earns[0] + a.earns[1]) / 2) * pressure;
      r.score += pts;
      r.parts.push({ text: `Earns GH₵ ${a.earns[0]}${a.earns[1] !== a.earns[0] ? '–' + a.earns[1] : ''}`, pts, up: true });
    }
    if (a.cost) {
      const pts = -(M.costWeight ?? 1.5) * cedis(a.cost) * Math.max(pressure, 0.1);
      r.score += pts;
      r.parts.push({ text: `Costs GH₵ ${a.cost}`, pts, up: false });
    }
    const fan = s.traits.map(t => traits[t]).find(t => t && (t.likes || []).includes(a.id));
    if (fan) {
      const pts = r.score > 0 ? r.score * ((M.traitLikeBonus ?? 1.5) - 1) : 4;
      r.score += pts;
      r.parts.push({ text: `${fan.name}: likes this`, pts, up: true });
    }
    const last = s.recent?.[a.id];
    if (last !== undefined && !isSleep(a) && s.time - last < (M.repeatMinutes ?? 120) && r.score > 0) {
      const pts = -r.score * (1 - (M.repeatFactor ?? 0.5));
      r.score += pts;
      r.parts.push({ text: 'Did this a moment ago', pts, up: false });
    }
    if (planned.has(a.id)) {
      const pts = M.routineBonus ?? 20;
      r.score += pts;
      r.parts.push({ text: `Routine: ${plan.do}`, pts, up: true });
    }
    rows.push(r);
  }
  rows.sort((x, y) => (!!x.lock - !!y.lock) || y.score - x.score);
  return rows;
}
// Picks one of the best few (the better, the likelier), so a Coaster never feels like a robot.
function pickAction(rows, model, rand = Math.random) {
  const open = rows.filter(r => !r.lock && r.score > 0.5).slice(0, Math.max(1, model.pickFromTop || 3));
  if (!open.length) return null;
  let x = rand() * open.reduce((t, r) => t + r.score, 0);
  for (const r of open) if ((x -= r.score) <= 0) return r;
  return open[open.length - 1];
}
// Lives through an action (or 30 minutes of nothing): needs fall while it lasts, then it gives what it gives.
// Sleep lasts until the Coaster is rested, and gives that share of what it gives.
function liveThrough(d, s, a, rand = Math.random) {
  const M = d.decisionModel || {};
  const rest = a ? restOf(a, s) : 1;
  const minutes = Math.max(5, Math.round((a ? a.minutes || 30 : 30) * rest));
  const asleep = isSleep(a);
  const before = { ...s.needs };
  for (const n of d.needs || []) {
    const delta = Math.round(((a && a.needs?.[n.id]) || 0) * rest);
    let v = s.needs[n.id] ?? 100;
    if (delta <= 0) v -= (n.decay?.[s.stage] || 0) * (minutes / 60) * (asleep ? M.sleepDecay ?? 0.5 : 1);
    s.needs[n.id] = clamp(v + delta, 0, 100);
  }
  let earned = 0;
  if (a) {
    (s.recent ||= {})[a.id] = s.time;
    if (a.earns) earned = Math.round((a.earns[0] + rand() * (a.earns[1] - a.earns[0])) * 2) / 2;
    s.money = Math.max(0, Math.round((s.money + earned - (a.cost || 0)) * 100) / 100);
  }
  s.time += minutes;
  return { before, earned };
}

  'actions', 'events', 'worldRhythms', 'buildParts', 'jobs', 'tutorial'];

// ---- opening ----
async function start() {
  bindEvents();
  const asked = location.hash.slice(1);
  if (TABS[asked]) tab = asked;
  if (location.protocol.startsWith('http')) {
    try {
      const r = await fetch(FILE, { cache: 'no-store' });
      if (r.ok) {
        mode = r.headers.get('X-Coaster-Save') ? 'server' : 'download';
        return open(await r.text());
      }
    } catch (e) { /* not served next to the file: show the ways in */ }
  }
  welcome();
}
function open(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return welcome(`That file isn't valid JSON: ${e.message}`); }
  if (!data || !Array.isArray(data.opportunities)) return welcome("That file doesn't look like the Coaster Life design (it has no \"opportunities\").");
  D = normalise(data);
  undo = []; redo = []; dirty = false; saveError = ''; selected = ''; editing = null;
  sim = newSim();
  render();
  const b = readBackup();
  if (b && b.dirty && b.text !== text && b.text !== pretty(D) + '\n') offerRestore(b);
  else writeBackup(false);
}
function welcome(problem = '') {

  <section class="card welcome">

}
async function pickFile() {
  if (!window.showOpenFilePicker) return $('#fileInput').click();

    const [h] = await window.showOpenFilePicker({ types: [{ description: 'Coaster Life design', accept: { 'application/json': ['.json'] } }] });

    const text = await (await h.getFile()).text();

function readBackup() {

}
function writeBackup(isDirty) {

function offerRestore(b) {

      <button class="btn" data-act="discard-backup">Keep the file as it is</button>

// Every change goes through here, so it can be undone.
function change(fn) {
  undo.push(JSON.stringify(D));
  if (undo.length > 80) undo.shift();
  redo = [];
  fn(D);
  touched();
}
function touched(rerender = true) {
  dirty = true;
  writeBackup(true);
  if (mode !== 'download') { clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
  if (rerender) render(); else showStatus();
}
function step(from, to) {
  if (!from.length) return;
  to.push(JSON.stringify(D));
  D = normalise(JSON.parse(from.pop()));
  if (selected && !byId(D.opportunities)[selected]) selected = '';
  editing = null;
  touched();
}
async function save() {
  clearTimeout(saveTimer);
  if (!D) return;
  if (saving) { saveTimer = setTimeout(save, 400); return; }
  D.meta.updated = today();
  const text = pretty(D) + '\n';
  if (mode === 'download') {
    download(text);
    dirty = false; saveError = ''; savedAt = new Date(); writeBackup(false); showStatus();
    toast('Downloaded coaster_life.json: put it in the design folder');
    return;
  }
  saving = true; showStatus();
  try {
    if (mode === 'server') {
      const r = await fetch(FILE, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: text });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `the server answered ${r.status}`);
    } else {
      const w = await handle.createWritable();
      await w.write(text);
      await w.close();
    }
    saveError = ''; savedAt = new Date();
    if (pretty(D) + '\n' === text) { dirty = false; writeBackup(false); } // nothing changed while it saved
  } catch (e) {
    saveError = e.message || String(e);
  }
  saving = false;
  showStatus();
}
function download(text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = FILE;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
const whereSaves = () => mode === 'server' ? 'Every change saves straight into design/coaster_life.json (serve.py keeps backups in design/backups).'
  : mode === 'file' ? `Every change saves straight into ${handle?.name || 'the file you opened'}.`
  : "This browser can't change the file by itself: Save downloads coaster_life.json, to put in the design folder. Changes are kept in this browser until then.";
function showStatus() {
  const el = $('#status');
  if (!el || !D) return;
  let text, cls;
  if (saveError) { text = `⚠ Not saved: ${saveError}`; cls = 'bad'; }
  else if (saving) { text = 'Saving…'; cls = ''; }
  else if (dirty) { text = mode === 'download' ? '● Not in the file yet: press Save' : '● Saving soon…'; cls = 'dirty'; }
  else if (savedAt) { text = `✓ Saved ${savedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`; cls = 'ok'; }
  else { text = mode === 'download' ? 'Save downloads the file' : '✓ Up to date'; cls = mode === 'download' ? '' : 'ok'; }
  el.textContent = text;
  el.className = `status ${cls}`;
  el.title = whereSaves();
  $('#undoBtn').disabled = !undo.length;
  $('#redoBtn').disabled = !redo.length;
  const problems = lint(D), c = $('#checks');
  c.hidden = false;
  c.textContent = problems.length ? `⚠ ${problems.length} to check` : '✓ All links good';
  c.className = `status ${problems.some(p => p.level === 'error') ? 'bad' : problems.length ? 'dirty' : 'ok'}`;
}
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function drawChoices() {
  const el = $('#simChoices');
  if (!el) return;
  const rows = scoreActions(D, sim), open = rows.filter(r => !r.lock), shut = rows.filter(r => r.lock);
  const top = Math.max(1, D.decisionModel.pickFromTop || 3), best = Math.max(1, ...open.map(r => r.score));
  const row = (r, i) => `<div class="choice ${i >= 0 && i < top && r.score > 0.5 ? 'top' : ''} ${r.lock ? 'locked' : ''}">
    <span class="rank">${i >= 0 ? i + 1 : '🔒'}</span>

      <div class="parts">${r.parts.map(p => `<span class="pill ${p.up ? 'up' : 'down'}">${esc(p.text)}<i>${p.pts >= 0 ? '+' : ''}${p.pts.toFixed(0)}</i></span>`).join('')}${r.lock ? `<span class="lock">${esc(r.lock)}</span>` : ''}</div></div>
    <div class="score"><div class="bar"><i style="width:${clamp(r.score / best * 100, 0, 100)}%"></i></div><span>${r.score.toFixed(0)}</span></div></div>`;
  el.innerHTML = (open.length ? open.slice(0, 10).map(row).join('') : '<p class="muted">Nothing they can do right now.</p>')
    + (open.length > 10 ? `<details class="more"><summary>${open.length - 10} more they could do</summary>${open.slice(10).map((r, i) => row(r, i + 10)).join('')}</details>` : '')
    + (shut.length ? `<details class="more"><summary>${shut.length} they can't do yet, and why</summary>${shut.map(r => row(r, -1)).join('')}</details>` : '');
}
function simStep() {
  const pick = pickAction(scoreActions(D, sim), D.decisionModel);
  const when = dayAndTime(sim.time);
  const { before, earned } = liveThrough(D, sim, pick?.a || null);
  const changes = D.needs.map(n => {
    const d = Math.round(sim.needs[n.id] - before[n.id]);
    return d ? `${n.icon} ${d > 0 ? '+' : ''}${d}` : '';
  }).filter(Boolean).join('  ');
  sim.log.push({
    when, text: pick ? pick.a.name : 'Wanders about: nothing seems worth doing', place: pick ? placeName(pick.a.place) : '', changes,
    money: earned ? `earned GH₵ ${earned}` : pick?.a.cost ? `spent GH₵ ${pick.a.cost}` : '',
    empties: D.needs.filter(n => sim.needs[n.id] <= 0 && before[n.id] > 0).map(n => n.name)
  });
  if (sim.log.length > 120) sim.log.shift();
}
function simDay() {
  const end = sim.time + 1440;
  for (let n = 0; sim.time < end && n < 90; n++) simStep();
}

function afterMap(keep) {
  const box = $('.map-scroll');
  box.style.height = `calc(100vh - ${$('#top').offsetHeight + $('.map-tools').offsetHeight}px)`;
  if (keep) { box.scrollLeft = keep[0]; box.scrollTop = keep[1]; }
  let drag = null;
  box.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.node')) return;
    drag = { x: e.clientX, y: e.clientY, l: box.scrollLeft, t: box.scrollTop, moved: false };
    box.setPointerCapture(e.pointerId);
    box.classList.add('panning');
  });
  box.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    box.scrollLeft = drag.l - dx;
    box.scrollTop = drag.t - dy;
  });
  const end = () => {
    if (!drag) return;
    const clicked = !drag.moved;
    drag = null;
    box.classList.remove('panning');
    if (clicked && selected && !editing) { selected = ''; refreshMarks(); renderDrawer(); } // a click on the empty map
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  box.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e);
  }, { passive: false });
  refreshMarks();
}
function setZoom(z, e) {
  const box = $('.map-scroll');
  if (!box || !layout) return;
  z = clamp(z, 0.3, 1.6);
  const r = box.getBoundingClientRect();
  const cx = e ? e.clientX - r.left : box.clientWidth / 2, cy = e ? e.clientY - r.top : box.clientHeight / 2;
  const mx = (box.scrollLeft + cx) / zoom, my = (box.scrollTop + cy) / zoom;
  zoom = z;
  $('.map-size').style.width = `${layout.width * zoom}px`;
  $('.map-size').style.height = `${layout.height * zoom}px`;
  $('.map').style.transform = `scale(${zoom})`;
  $('#zoomLabel').textContent = `${Math.round(zoom * 100)}%`;
  box.scrollLeft = mx * zoom - cx;
  box.scrollTop = my * zoom - cy;
}
// Lights up the chosen step with everything before and after it, what the search finds, or one of the six kinds.
function refreshMarks() {
  const map = $('.map');
  if (!map) return;
  const before = selected ? ancestors(D, selected) : null, after = selected ? descendants(D, selected) : null;
  const q = query.trim().toLowerCase();
  const found = q ? new Set(D.opportunities.filter(o => [o.name, o.id, o.summary, o.cost, ...(o.requires || []).map(r => r.what), ...(o.unlocks || [])]
    .join(' ').toLowerCase().includes(q)).map(o => o.id)) : null;
  const kind = focusDim ? new Set(D.opportunities.filter(o => (o.requires || []).some(r => r.kind === focusDim)).map(o => o.id)) : null;
  const family = id => id === selected || before.has(id) || after.has(id);
  const lit = id => (!selected || family(id)) && (!found || found.has(id)) && (!kind || kind.has(id));
  for (const el of $$('.node', map)) {
    const id = el.dataset.id;
    el.classList.toggle('sel', id === selected);
    el.classList.toggle('path', !!selected && id !== selected && family(id));
    el.classList.toggle('dim', !lit(id));
  }
  const filtering = !!(selected || found || kind);
  for (const el of $$('.edge', map)) {
    const a = el.dataset.from, b = el.dataset.to;
    const hot = !!selected && (((before.has(a)) && (before.has(b) || b === selected)) || ((a === selected || after.has(a)) && after.has(b)));
    el.classList.toggle('hot', hot);
    el.classList.toggle('dim', filtering && !hot && !(!selected && lit(a) && lit(b)));
    el.setAttribute('marker-end', hot ? 'url(#arrowHot)' : 'url(#arrow)');
  }
}

function select(id) {
  if (editing && !leaveEdit()) return;
  editing = null;
  selected = id;
  if (tab !== 'progress') { tab = 'progress'; history.replaceState(null, '', '#progress'); window.scrollTo(0, 0); render(); }
  else { refreshMarks(); renderDrawer(); }
  scrollToNode(id);
}
const leaveEdit = () => confirm('Leave this step without saving it?');
function startEdit(o) {
  editing = JSON.parse(JSON.stringify(o));
  Object.assign(editing, { _origId: o.id, requires: editing.requires || [], after: editing.after || [], unlocks: editing.unlocks || [] });
  editing.summary ??= ''; editing.cost ??= '';
  renderDrawer();
}
function newDraft(parentId) {
  const p = parentId && byId(D.opportunities)[parentId];
  editing = { _isNew: true, _origId: null, id: '', name: '', stage: p?.stage || D.lifeStages[0]?.id, track: p?.track || D.tracks[0]?.id,
    where: p?.where || '', summary: '', requires: [{ kind: 'choices', what: '' }, { kind: 'skills', what: '' }], after: p ? [p.id] : [], cost: '', unlocks: [] };
  if (tab !== 'progress') { tab = 'progress'; history.replaceState(null, '', '#progress'); render(); } else renderDrawer();
  setTimeout(() => $('#drawer input')?.focus(), 60);
}
function saveOpp() {
  const e = editing, fail = text => { $('#formError').textContent = text; };
  const name = (e.name || '').trim(), id = (e.id || '').trim();
  if (!name) return fail('Give it a name.');
  if (!/^[a-z0-9_]+$/.test(id)) return fail('The id can only have small letters, numbers and _.');
  if (D.opportunities.some(o => o.id === id && o.id !== e._origId)) return fail(`Another step already has the id "${id}".`);
  const out = {};
  for (const k of Object.keys(e)) if (!k.startsWith('_')) out[k] = e[k];
  Object.assign(out, { id, name, summary: (e.summary || '').trim(), cost: (e.cost || '').trim(),
    requires: e.requires.filter(r => r.what.trim()).map(r => ({ kind: r.kind, what: r.what.trim() })),
    unlocks: e.unlocks.map(s => s.trim()).filter(Boolean) });
  if (!out.where) delete out.where;
  if (!(out.afterAny && out.after.length > 1)) delete out.afterAny;
  const ordered = e._isNew ? { id, name, stage: out.stage, track: out.track, ...out } : out;
  change(d => {
    if (e._isNew) d.opportunities.push(ordered);
    else {
      d.opportunities[d.opportunities.findIndex(o => o.id === e._origId)] = ordered;
      if (e._origId !== id) renameOpp(d, e._origId, id);
    }
    editing = null;
    selected = id;
  });
  toast(e._isNew ? `Added "${name}"` : `Saved "${name}"`);
  scrollToNode(id);
}

// What a job can bring into the game: its key in "uses", the design's list, a label, and a color.
const USE_KINDS = [['needs', 'needs', 'Needs', '#b23a2e'], ['steps', 'opportunities', 'Steps', '#b07a08'], ['actions', 'actions', 'Actions', '#1d6b3a'],
  ['places', 'places', 'Places', '#3f7a3a'], ['coasters', 'coasters', 'People', '#7a4fd0'], ['events', 'events', 'Events', '#b23a2e'],
  ['achievements', 'achievements', 'Achievements', '#b38600'], ['skills', 'skills', 'Skills', '#d27f1f'], ['moodlets', 'moodlets', 'Moodlets', '#c2507a']];
const jobOf = (kind, id) => D.jobs.find(j => (j.uses?.[kind] || []).includes(id));
function jobChip(kind, id) {
  const j = jobOf(kind, id);
  if (!j) return '';
  const label = j.number ? `Job ${j.number}` : j.status === 'done' ? 'In the game' : 'Later';
  return `<button class="chip job-chip ${esc(j.status)}" data-act="go" data-tab="plan" data-id="job-${esc(j.id)}" title="${esc(j.title)}">${esc(label)}</button>`;
}
function moveJob(i, step) {
  const part = D.jobs[i].part;
  let j = i + step;
  while (j >= 0 && j < D.jobs.length && D.jobs[j].part !== part) j += step; // stays within its part
  if (j < 0 || j >= D.jobs.length) return;
  change(d => { [d.jobs[i], d.jobs[j]] = [d.jobs[j], d.jobs[i]]; });
}
function usesChips(uses, kinds = USE_KINDS) {
